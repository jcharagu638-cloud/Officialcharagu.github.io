<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>James Charagu Links</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 300px;
      background: #ff4500;
      color: #fff;
      text-decoration: none;
      padding: 15px 20px;
      margin: 10px 0;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .link-button:hover {
      transform: translateY(-3px);
      background: #ff6347;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .link-button img {
      height: 24px;
      width: 24px;
      margin-right: 12px;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #ccc;
    }

    @media (max-width: 400px) {
      h1 { font-size: 2rem; }
      .link-button { font-size: 1rem; padding: 12px; }
      .link-button img { height: 20px; width: 20px; margin-right: 8px; }
    }
  </style>
</head>

<body>

  <h1>James Charagu</h1>

  <a class="link-button" href="https://www.instagram.com/official_charagu" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png"> Instagram
  </a>

  <a class="link-button" href="https://www.tiktok.com/@official_charagu?_r=1&_t=ZS-93ztVFrT454" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/3046/3046123.png"> TikTok
  </a>

  <a class="link-button" href="https://youtube.com/@officialcharagu" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"> YouTube
  </a>

  <footer>
    © 2026 James Charagu
  </footer>

</body>
</html>
